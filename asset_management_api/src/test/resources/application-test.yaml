spring:
  application:
    name: asset_management_test

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    enabled: true

  cache:
    type: none

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

authorization:
  token:
    secret: test-secret-key-for-testing-purposes-only-must-be-long-enough
    refresh-secret: test-refresh-secret-key-for-testing-purposes-only-must-be-long
  access-token:
    expiration-time: 900000
  refresh-token:
    expiration-time: 18000000

server:
  port: 0
  ssl:
    enabled: false

logging:
  level:
    root: WARN
    com.example: INFO
